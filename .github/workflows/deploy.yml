name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          PUBLIC_GOATCOUNTER_CODE: ${{ vars.PUBLIC_GOATCOUNTER_CODE }}
        run: ASTRO_TELEMETRY_DISABLED=1 npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    # Tell IndexNow search engines (Bing, Yandex, Seznam, Naver) which pages exist after each deploy.
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    steps:
      - name: Submit sitemap URLs to IndexNow
        env:
          INDEXNOW_KEY: 00fca127afbcbf77b18a3a954e2a84fd
        run: |
          curl -fsSL https://helghareeb.github.io/sitemap.xml -o sitemap.xml
          python3 - <<'PY'
          import json, os, re, urllib.request
          urls = re.findall(r'<loc>([^<]+)</loc>', open('sitemap.xml', encoding='utf-8').read())
          key = os.environ['INDEXNOW_KEY']
          body = {'host': 'helghareeb.github.io', 'key': key,
                  'keyLocation': f'https://helghareeb.github.io/{key}.txt', 'urlList': urls[:10000]}
          req = urllib.request.Request('https://api.indexnow.org/indexnow', data=json.dumps(body).encode(),
                                       headers={'Content-Type': 'application/json; charset=utf-8'})
          with urllib.request.urlopen(req, timeout=60) as r:
              print('IndexNow', r.status, 'for', len(urls), 'URLs')
          PY
